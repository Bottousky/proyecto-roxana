<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3940"/>
      <stop offset="1" stop-color="#29282e"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#355965"/>
      <stop offset="1" stop-color="#203b49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#101014" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#f1c66a"/>
    </marker>
    <style>
      .title{font:700 36px system-ui,sans-serif;fill:#f4ecdb}.sub{font:18px system-ui,sans-serif;fill:#c8c1b4}
      .region{stroke:#ded3bc;stroke-width:3;filter:url(#shadow)}.rname{font:700 22px system-ui,sans-serif;fill:#fff8e9}
      .unit{font:700 15px system-ui,sans-serif;fill:#27242a}.desc{font:15px system-ui,sans-serif;fill:#e7dece}
      .road{fill:none;stroke:#938878;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#f1c66a;stroke-width:5;stroke-dasharray:13 10;marker-end:url(#arrow)}
      .wire1,.wire2{fill:none;stroke-linecap:round;stroke-linejoin:round}.wire1{stroke:#bf7445;stroke-width:6}.wire2{stroke:#72a39c;stroke-width:4}
      .legend{font:15px system-ui,sans-serif;fill:#ddd4c3}.small{font:13px system-ui,sans-serif;fill:#c9c1b4}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#18171c"/>
  <text x="70" y="62" class="title">OHMDAL · mapa regional del Arco I</text>
  <text x="70" y="94" class="sub">La geografía baja desde el Castillo hasta el lago; el aprendizaje avanza por el mismo territorio y abre retornos.</text>

  <!-- territorio -->
  <path d="M95 230 Q210 120 410 145 Q570 70 760 150 Q955 120 1115 250 Q1280 350 1375 520 L1300 820 Q1120 900 900 870 Q690 940 480 860 Q260 875 115 720 Q55 490 95 230Z" fill="url(#land)" stroke="#59545e" stroke-width="5"/>
  <path d="M885 685 Q1070 620 1327 675 L1390 860 Q1200 955 930 885 Q850 820 885 685Z" fill="url(#lake)" stroke="#50727c" stroke-width="4"/>
  <path d="M135 292 Q310 220 470 250 Q645 270 755 395 Q910 505 1005 720" class="road"/>
  <path d="M370 255 Q245 405 285 585 Q435 690 645 585 Q790 535 920 645" class="road"/>

  <!-- red de cobre: siempre se dibuja en par para no enseñar un cable único -->
  <path d="M325 230 C420 260 505 295 625 370 C715 430 760 520 865 615 C920 670 958 705 1015 745" class="wire1"/>
  <path d="M339 217 C435 245 523 281 640 356 C735 415 782 507 882 600 C943 655 980 691 1034 729" class="wire2"/>
  <path d="M625 370 C515 410 410 480 300 580" class="wire1"/>
  <path d="M640 356 C530 394 422 462 312 563" class="wire2"/>

  <!-- regiones -->
  <g>
    <path class="region" fill="#66516f" d="M170 174 L350 125 L455 205 L405 315 L220 320 L145 245Z"/>
    <rect x="230" y="142" width="58" height="29" rx="14" fill="#d9b96c"/>
    <text x="259" y="162" text-anchor="middle" class="unit">U2</text>
    <text x="188" y="220" class="rname">CASTILLO</text><text x="188" y="246" class="desc">fuente alta · reparto · Consejo</text>
  </g>
  <g>
    <path class="region" fill="#8c704d" d="M480 300 L700 300 L785 405 L710 520 L475 500 L415 392Z"/>
    <rect x="515" y="318" width="58" height="29" rx="14" fill="#d9b96c"/>
    <text x="544" y="338" text-anchor="middle" class="unit">U1</text>
    <text x="492" y="390" class="rname">PLAZA</text><text x="492" y="417" class="desc">portal · Ohm · Lumen · Puerta</text>
    <text x="492" y="443" class="desc">hub que cambia con cada unidad</text>
  </g>
  <g>
    <path class="region" fill="#86553c" d="M150 465 L355 430 L455 555 L365 695 L175 660 L112 550Z"/>
    <rect x="170" y="485" width="58" height="29" rx="14" fill="#d9b96c"/>
    <text x="199" y="505" text-anchor="middle" class="unit">U3</text>
    <text x="165" y="556" class="rname">FORJA</text><text x="165" y="583" class="desc">carga · calor · costo</text>
  </g>
  <g>
    <path class="region" fill="#57745f" d="M650 510 L875 470 L1010 575 L940 720 L730 750 L610 635Z"/>
    <rect x="700" y="532" width="58" height="29" rx="14" fill="#d9b96c"/>
    <text x="729" y="552" text-anchor="middle" class="unit">U4</text>
    <text x="690" y="610" class="rname">TERRAZAS</text><text x="690" y="637" class="desc">caídas · escalera · predicción</text>
  </g>
  <g>
    <path class="region" fill="#476b78" d="M955 675 L1110 625 L1235 712 L1200 855 L1025 880 L920 790Z"/>
    <rect x="1004" y="695" width="58" height="29" rx="14" fill="#d9b96c"/>
    <text x="1033" y="715" text-anchor="middle" class="unit">U5</text>
    <text x="985" y="772" class="rname">FARO + RELOJ</text><text x="985" y="799" class="desc">memoria · tiempo · noche</text>
  </g>

  <!-- landmarks y conexiones -->
  <circle cx="590" cy="286" r="17" fill="#d09a4b" stroke="#f7d98e" stroke-width="3"/>
  <text x="617" y="291" class="small">Puerta de Ohm: umbral entre plaza y red alta</text>
  <circle cx="580" cy="535" r="14" fill="#55aaa0" stroke="#b6eee5" stroke-width="3"/>
  <text x="603" y="540" class="small">Portal al Instituto</text>
  <circle cx="1182" cy="742" r="15" fill="#e4c36b" stroke="#fff0ab" stroke-width="3"/>
  <path d="M1182 727 L1182 675 L1200 700 L1182 700" fill="#e4c36b"/>

  <!-- recorrido principal -->
  <path d="M590 535 C630 500 645 468 635 430" class="route"/>
  <path d="M540 324 C470 280 420 246 370 230" class="route"/>
  <path d="M260 330 C220 390 215 455 235 485" class="route"/>
  <path d="M420 615 C520 675 620 674 695 635" class="route"/>
  <path d="M918 690 C965 715 990 730 1015 744" class="route"/>

  <!-- panel -->
  <rect x="1260" y="118" width="285" height="420" rx="18" fill="#242229" stroke="#514d56" stroke-width="2"/>
  <text x="1290" y="158" class="rname">REGLAS DEL MAPA</text>
  <text x="1290" y="198" class="legend">1. Cada unidad ocupa una región</text><text x="1308" y="221" class="small">con material, silueta y problema propios.</text>
  <text x="1290" y="259" class="legend">2. La Plaza es hogar, no menú.</text><text x="1308" y="282" class="small">Cambia y ofrece retornos, pero la ruta</text><text x="1308" y="302" class="small">no vuelve siempre por el mismo pasillo.</text>
  <text x="1290" y="340" class="legend">3. El relieve cuenta el currículo.</text><text x="1308" y="363" class="small">Distribución arriba; carga al margen;</text><text x="1308" y="383" class="small">caídas por niveles; tiempo junto al lago.</text>
  <text x="1290" y="421" class="legend">4. La red tiene ida y retorno.</text><text x="1308" y="444" class="small">Los dos canales visibles evitan que la</text><text x="1308" y="464" class="small">metáfora del río enseñe un cable único.</text>
  <line x1="1290" y1="500" x2="1350" y2="500" class="route"/><text x="1370" y="506" class="small">avance curricular</text>
  <line x1="1290" y1="530" x2="1350" y2="530" class="wire1"/><line x1="1290" y1="520" x2="1350" y2="520" class="wire2"/><text x="1370" y="530" class="small">red de cobre</text>

  <text x="70" y="950" class="small">Greybox de diseño · no es concept art. Norte arriba. Las proporciones expresan relación y ritmo, no escala final de producción.</text>
</svg>
