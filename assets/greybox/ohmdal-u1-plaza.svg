<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#5a555f" stroke-width=".6" opacity=".65"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffe08b"/></marker>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#f7efde}.sub{font:17px system-ui,sans-serif;fill:#c8c0b1}.h{font:700 19px system-ui,sans-serif;fill:#fff0ce}.txt{font:15px system-ui,sans-serif;fill:#ded6c6}.small{font:13px system-ui,sans-serif;fill:#c9c0b1}
      .floor{fill:#756c60;stroke:#b5aa97;stroke-width:2}.lane{fill:#625b54;stroke:#9c9181;stroke-width:2}.solid{fill:#343139;stroke:#7d7581;stroke-width:2}.hero{fill:#9f7542;stroke:#f0c26d;stroke-width:3}.future{fill:#3d3a42;stroke:#8a7d8f;stroke-width:2;stroke-dasharray:7 5}.prop{fill:#514a46;stroke:#a49a8d;stroke-width:2}
      .copper{fill:none;stroke:#c27645;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.return{fill:none;stroke:#73a89f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.crit{fill:none;stroke:#ffe08b;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}
      .beat{fill:#ffe08b;stroke:#2b282e;stroke-width:3}.beatnum{font:700 15px system-ui,sans-serif;fill:#2c292e;text-anchor:middle;dominant-baseline:central}.label{font:700 13px system-ui,sans-serif;fill:#fff4dc;paint-order:stroke;stroke:#262329;stroke-width:4;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#18171c"/>
  <text x="40" y="52" class="title">U1 · Plaza de Ohmdal — greybox de producción</text>
  <text x="40" y="82" class="sub">96×64 tiles · tile base 32 px · mundo 3072×2048 px · cámara 960×540 · norte arriba</text>
  <text x="40" y="115" class="small">En este plano cada cuadrado visible equivale a 1 tile. Los interiores de Lumen y la Puerta pueden seguir como salas separadas.</text>

  <!-- mapa: origen 40,150; 12 px por tile -->
  <g transform="translate(40 150)">
    <rect width="1152" height="768" fill="#242229" stroke="#6e6872" stroke-width="3"/>

    <!-- suelos transitables -->
    <rect class="floor" x="240" y="216" width="660" height="372" rx="8"/>
    <rect class="lane" x="468" y="576" width="216" height="168"/>
    <rect class="floor" x="396" y="48" width="360" height="180"/>
    <rect class="lane" x="96" y="216" width="156" height="168"/>
    <rect class="lane" x="96" y="48" width="132" height="168"/>
    <rect class="lane" x="96" y="456" width="156" height="96"/>
    <rect class="lane" x="888" y="336" width="180" height="156"/>
    <rect class="lane" x="888" y="552" width="216" height="108"/>

    <!-- masas de arquitectura / límites -->
    <path class="solid" d="M252 204H396V36H768V204H888V96H1128V324H876V228H756V48H396V228H252Z"/>
    <path class="solid" d="M252 600H456V756H60V564H252ZM696 600H876V504H1128V756H696Z"/>
    <rect class="solid" x="12" y="24" width="72" height="720"/>
    <rect class="solid" x="228" y="72" width="156" height="132"/>

    <!-- destinos futuros visibles pero cerrados -->
    <rect class="future" x="108" y="60" width="108" height="48"/>
    <text x="162" y="89" text-anchor="middle" class="label">CASTILLO · U2</text>
    <rect class="future" x="108" y="468" width="132" height="48"/>
    <text x="174" y="497" text-anchor="middle" class="label">FORJA · U3</text>
    <rect class="future" x="984" y="600" width="108" height="48"/>
    <text x="1038" y="629" text-anchor="middle" class="label">TERRAZAS · U4</text>

    <!-- piezas hero -->
    <rect class="hero" x="516" y="66" width="120" height="72" rx="8"/>
    <text x="576" y="96" text-anchor="middle" class="label">PUERTA DE OHM</text><text x="576" y="116" text-anchor="middle" class="label">puzzle 3</text>
    <rect class="hero" x="1032" y="354" width="72" height="114" rx="6"/>
    <rect x="1020" y="390" width="18" height="42" fill="#c7b99e"/>
    <text x="1068" y="381" text-anchor="middle" class="label">TALLER</text><text x="1068" y="402" text-anchor="middle" class="label">LUMEN</text>
    <rect class="hero" x="114" y="246" width="72" height="72" rx="8"/>
    <path d="M150 250V226M132 234H168" stroke="#f0c26d" stroke-width="5"/><circle cx="150" cy="222" r="12" fill="#b79349"/>
    <text x="150" y="342" text-anchor="middle" class="label">CAMPANA</text>
    <ellipse class="hero" cx="576" cy="690" rx="54" ry="30"/><text x="576" y="696" text-anchor="middle" class="label">PORTAL</text>
    <circle class="hero" cx="576" cy="390" r="43"/><circle cx="576" cy="390" r="18" fill="#39373d" stroke="#dec074" stroke-width="3"/>
    <text x="576" y="450" text-anchor="middle" class="label">PEDESTAL / OHM</text>

    <!-- obstáculos que encuadran y guían, no laberinto -->
    <rect class="prop" x="294" y="300" width="144" height="60" rx="5"/><text x="366" y="336" text-anchor="middle" class="label">puestos apagados</text>
    <rect class="prop" x="714" y="438" width="132" height="54" rx="5"/><text x="780" y="470" text-anchor="middle" class="label">puestos</text>
    <rect class="prop" x="294" y="492" width="96" height="42" rx="5"/>
    <circle class="prop" cx="456" cy="300" r="15"/><circle class="prop" cx="696" cy="300" r="15"/>
    <circle class="prop" cx="426" cy="510" r="15"/><circle class="prop" cx="726" cy="540" r="15"/>
    <text x="448" y="282" class="label">lámparas</text>

    <!-- red del suelo: dos canales, con ramales legibles -->
    <path class="copper" d="M558 138V344Q558 366 538 378L456 426M558 434V660M534 390H474M534 402H210M618 390H996"/>
    <path class="return" d="M594 138V344Q594 370 614 382L690 426M594 434V660M618 402H996M618 414H210"/>

    <!-- ruta crítica, no dibujar en arte final -->
    <path class="crit" d="M576 660V470"/>
    <path class="crit" d="M630 408C740 410 845 405 1008 410"/>
    <path class="crit" d="M996 372C840 310 690 245 610 154"/>
    <path class="crit" d="M522 150C420 170 290 230 198 274"/>

    <!-- beats -->
    <g><circle class="beat" cx="576" cy="648" r="16"/><text class="beatnum" x="576" y="648">1</text></g>
    <g><circle class="beat" cx="650" cy="432" r="16"/><text class="beatnum" x="650" y="432">2</text></g>
    <text x="670" y="438" class="label">EDDA</text>
    <g><circle class="beat" cx="576" cy="390" r="16"/><text class="beatnum" x="576" y="390">3</text></g>
    <g><circle class="beat" cx="1000" cy="410" r="16"/><text class="beatnum" x="1000" y="410">4</text></g>
    <g><circle class="beat" cx="576" cy="168" r="16"/><text class="beatnum" x="576" y="168">5</text></g>
    <g><circle class="beat" cx="205" cy="288" r="16"/><text class="beatnum" x="205" y="288">6</text></g>

    <!-- grilla por encima -->
    <rect width="1152" height="768" fill="url(#grid)" pointer-events="none"/>
    <text x="18" y="20" class="small">0,0</text><text x="1108" y="752" class="small">96,64</text>
  </g>

  <!-- lateral -->
  <g transform="translate(1230 150)">
    <rect width="330" height="768" rx="14" fill="#242229" stroke="#5b5660" stroke-width="2"/>
    <text x="24" y="40" class="h">RUTA CRÍTICA · 6 beats</text>
    <circle class="beat" cx="35" cy="78" r="14"/><text class="beatnum" x="35" y="78">1</text><text x="61" y="83" class="txt">Entrada: portal y vista al norte</text>
    <circle class="beat" cx="35" cy="119" r="14"/><text class="beatnum" x="35" y="119">2</text><text x="61" y="124" class="txt">Edda intercepta sin bloquear</text>
    <circle class="beat" cx="35" cy="160" r="14"/><text class="beatnum" x="35" y="160">3</text><text x="61" y="165" class="txt">Ohm: camino completo</text>
    <circle class="beat" cx="35" cy="201" r="14"/><text class="beatnum" x="35" y="201">4</text><text x="61" y="206" class="txt">Lumen: piedras de freno</text>
    <circle class="beat" cx="35" cy="242" r="14"/><text class="beatnum" x="35" y="242">5</text><text x="61" y="247" class="txt">Puerta: relación V/I/R</text>
    <circle class="beat" cx="35" cy="283" r="14"/><text class="beatnum" x="35" y="283">6</text><text x="61" y="288" class="txt">Campana: cierre + U2 visible</text>

    <text x="24" y="343" class="h">MÉTRICAS</text>
    <text x="24" y="378" class="txt">Pasillo principal: 5–7 tiles</text>
    <text x="24" y="404" class="txt">Pasillo mínimo: 3 tiles</text>
    <text x="24" y="430" class="txt">Puertas: 3–4 tiles</text>
    <text x="24" y="456" class="txt">Objetivo visible: ≤ 1 cámara</text>
    <text x="24" y="482" class="txt">Tramo sin decisión: ≤ 12 s</text>
    <text x="24" y="508" class="txt">Ruta total exterior: ~65 s</text>

    <text x="24" y="567" class="h">LECTURA VISUAL</text>
    <rect class="floor" x="24" y="590" width="30" height="20"/><text x="67" y="606" class="txt">piso caminable</text>
    <rect class="solid" x="24" y="622" width="30" height="20"/><text x="67" y="638" class="txt">masa / colisión</text>
    <rect class="hero" x="24" y="654" width="30" height="20"/><text x="67" y="670" class="txt">landmark / pieza héroe</text>
    <rect class="future" x="24" y="686" width="30" height="20"/><text x="67" y="702" class="txt">ruta futura visible</text>
    <line x1="24" y1="730" x2="55" y2="730" class="copper"/><line x1="24" y1="720" x2="55" y2="720" class="return"/><text x="67" y="730" class="txt">ida + retorno</text>
  </g>

  <text x="40" y="970" class="small">La línea amarilla es dirección de puesta en escena, no un riel: el jugador puede curiosear. Los tres caminos futuros existen desde el principio y cambian de estado; no aparecen mágicamente.</text>
  <text x="40" y="997" class="small">La plaza ofrece dos recorridos alrededor del pedestal. Los puestos cortan diagonales largas para que tap-to-move no choque siempre con el mismo obstáculo.</text>
</svg>
