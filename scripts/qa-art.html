<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohmdal · Dirección de arte del elenco</title>
<style>body{margin:0;background:#102824;color:#f1dfb7;font:13px system-ui}header{padding:12px 24px;display:flex;gap:24px;align-items:center}h1{font:25px Georgia;margin:0}main{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:12px 24px}article{background:#1b3430;border:1px solid #a68b5150;padding:10px;text-align:center}h2{font:20px Georgia;margin:0 0 6px}.pair{display:flex;align-items:end;justify-content:center}.pair .portrait{mask-image:none!important;flex:0 1 140px!important;width:140px!important;height:140px!important;min-height:140px!important;margin:0!important;aspect-ratio:1}.sprite{width:65px;height:90px;object-fit:contain;image-rendering:pixelated}p{font-size:11px;color:#a8b7a8;margin:10px 0 0}#engine{position:fixed;left:-500px;width:32px;height:32px}label{margin-left:auto}button{padding:7px;background:#bca16d;color:#193932;border:0}body.previous .portrait{background-image:url('/assets/portraits.webp');background-size:200% 200%}body.previous .portrait-edda{background-position:0 0}body.previous .portrait-lumen{background-position:0 100%}body.previous .portrait-nereo{background-position:100% 100%}body.previous .portrait-ohm{background-image:url('/assets/ohm-portrait.webp');background-size:cover}body.previous :is(.portrait-player,.portrait-vega,.portrait-consejera,.portrait-yesca,.portrait-marin,.portrait-tala){background-image:url('/assets/portraits-2.webp');background-size:300% 200%}body.previous .portrait-vega{background-position:0 0}body.previous .portrait-consejera{background-position:50% 0}body.previous .portrait-yesca{background-position:100% 0}body.previous .portrait-marin{background-position:0 100%}body.previous .portrait-tala{background-position:50% 100%}body.previous .portrait-player{background-position:100% 100%}@media(max-width:800px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<header><h1>Ohmdal · El mismo personaje</h1><span>Sprite → retrato</span><label><input id="before" type="checkbox"> Comparar retratos anteriores</label></header><main id="cast"></main><canvas id="engine"></canvas>
<script type="module">
import '../src/style.css';import '../src/art-polish.css';import {World} from '../src/world.js';import {CHARACTERS} from '../src/content.js';
const world=new World(document.querySelector('#engine'));const result=await world.assetsReady;
if(result.ok){for(const id of ['player','edda','lumen','nereo','ohm','vega','consejera','yesca','marin','tala']){
 const c=CHARACTERS[id],card=document.createElement('article'),frame=id==='ohm'?world.ohmFrames[0][0]:world.atlasFrames[id][0][0];
 card.innerHTML=`<h2>${c.name}</h2><div class="pair"><img class="sprite" alt="Sprite de ${c.name}" src="${frame.image.toDataURL()}"><div class="portrait portrait-${id}" role="img" aria-label="Retrato de ${c.name}"></div></div><p>${c.role}</p>`;document.querySelector('#cast').append(card);
}world.dispose();}document.querySelector('#before').onchange=e=>document.body.classList.toggle('previous',e.target.checked);
</script></html>
