<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohmdal · Colisiones y arquitectura</title>
<style>body{margin:0;background:#102c32;color:#e9dec5;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}body>nav{position:fixed;z-index:2;left:10px;top:10px;right:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#112b32ef;padding:8px}button,select,input{font:inherit;min-height:36px;background:#29434b;color:#efe5c9;border:1px solid #bbad7955;padding:4px 8px}input[type=number]{width:60px}aside{position:fixed;bottom:12px;left:12px;z-index:2;padding:12px;background:#112b32ef;max-width:570px}p{margin:4px 0}</style>
<canvas id="world" aria-label="Mundo de prueba de colisiones" tabindex="0"></canvas>
<nav><label>Zona <select id="area"></select></label><button id="reset">Entrada</button><button id="next">Próxima zona</button><label><input id="debug" type="checkbox"> Huellas</label><label><input id="restored" type="checkbox" checked> Restaurado</label><button id="workshop">Fachada del taller</button><button id="inside">Recuperar posición dentro del taller</button><label>X <input id="x" type="number" value="0" step=".5"></label><label>Z <input id="z" type="number" value="0" step=".5"></label><button id="go">Caminar hasta punto</button><button data-move="-1,0">Izquierda</button><button data-move="1,0">Derecha</button><button data-move="0,-1">Fondo</button><button data-move="0,1">Frente</button><button id="stop">Detener</button><button id="map">Plano de esta zona</button></nav><section id="map-preview" style="display:none;position:fixed;inset:20px;z-index:5;overflow:auto;background:#142b31;padding:24px"><button id="map-close" style="float:right">Cerrar plano</button><div id="map-content"></div></section>
<aside><p id="status" role="status">Cargando arte…</p><p id="result"></p><small>Motor real, sin guardar ni modificar partidas. WASD/flechas, Shift para correr, clic para buscar ruta.</small></aside>
<script type="module">
import {renderWorldMap,mapStyles} from '../src/world-map.js';import * as THREE from 'three';import {World} from '../src/world.js';import {AREAS} from '../src/content.js';import {freshState} from '../src/state.js';
const $=s=>document.querySelector(s),state=freshState({muted:true}),world=new World($('#world')),ids=Object.keys(AREAS);let overlay,input={x:0,z:0},last=performance.now(),invalidFrames=0;const held=new Set();
$('#area').innerHTML=ids.map(id=>`<option value="${id}">${AREAS[id].name}</option>`).join('');
function flags(){state.flags={};if($('#restored').checked)for(const area of Object.values(AREAS))for(const o of [...area.objects,...area.exits]){for(const key of o.requires||[])state.flags[key]=true;if(o.puzzle)state.flags[o.puzzle]=true;if(o.flag)state.flags[o.flag]=true;}state.flags.awaken=true;}
function showHulls(){if(overlay){world.root.remove(overlay);overlay.traverse(o=>{o.geometry?.dispose();o.material?.dispose()})}overlay=new THREE.Group();for(const o of world.obstacles){const edges=new THREE.EdgesGeometry(new THREE.BoxGeometry(o.w*2,.2,o.d*2)),line=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0xff7755,depthTest:false}));line.position.set(o.x,.2,o.z);line.renderOrder=100;overlay.add(line)}overlay.visible=$('#debug').checked;world.root.add(overlay);}
function load(id,position){state.area=id;state.visited=[...ids];input={x:0,z:0};held.clear();flags();$('#area').value=id;world.loadArea(AREAS[id],state,position);world.cancelCinematic();showHulls();invalidFrames=0;$('#result').textContent='';}
document.querySelectorAll('nav button,nav input,nav select').forEach(e=>e.disabled=true);const assets=await world.assetsReady;if(!assets.ok)throw Error(assets.missing.join(', '));load('plaza',[0,6]);document.querySelectorAll('nav button,nav input,nav select').forEach(e=>e.disabled=false);
$('#map').onclick=()=>{$('#map-preview').style.display='block';$('#map-content').innerHTML=`<style>${mapStyles}</style>${renderWorldMap(state,{position:world.getPlayerPosition()})}`;for(const button of document.querySelectorAll('[data-area]'))button.onclick=()=>{load(button.dataset.area);$('#map').click()}};$('#map-close').onclick=()=>$('#map-preview').style.display='none';
$('#area').onchange=()=>load($('#area').value);$('#reset').onclick=()=>load($('#area').value);$('#next').onclick=()=>load(ids[(ids.indexOf($('#area').value)+1)%ids.length]);$('#restored').onchange=()=>load($('#area').value);$('#debug').onchange=()=>overlay.visible=$('#debug').checked;
$('#workshop').onclick=()=>load('plaza',[-13,10]);$('#inside').onclick=()=>{load('plaza',[-16.72,4]);$('#result').textContent=`Posición antigua reparada: ${world.getPlayerPosition().map(n=>n.toFixed(2)).join(', ')}. Progreso intacto.`};
$('#go').onclick=()=>{input={x:0,z:0};world.setTarget([Number($('#x').value),Number($('#z').value)])};for(const button of document.querySelectorAll('[data-move]'))button.onclick=()=>{[input.x,input.z]=button.dataset.move.split(',').map(Number);world.target=null;world.route=[]};$('#stop').onclick=()=>{input={x:0,z:0};held.clear();world.setTarget(null);world.target=null;world.route=[]};
$('#world').onclick=e=>{input={x:0,z:0};world.setTarget(world.pick(e.clientX,e.clientY))};addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;held.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));addEventListener('blur',()=>held.clear());
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const keys=held.size?{x:Number(held.has('d')||held.has('arrowright'))-Number(held.has('a')||held.has('arrowleft')),z:Number(held.has('s')||held.has('arrowdown'))-Number(held.has('w')||held.has('arrowup'))}:input;world.update(dt,state,{...keys,run:held.has('shift')});const p=world.getPlayerPosition(),safe=world.canStand(...p),companionSafe=world.canStand(world.ohm.position.x,world.ohm.position.z,.42);if(!safe||!companionSafe)invalidFrames++;$('#status').textContent=`${world.area.name} · ${world.obstacles.length} sólidos · jugador ${p.map(n=>n.toFixed(2)).join(', ')} · ${safe?'válido':'COLISIÓN'} · Ohm ${companionSafe?'válido':'COLISIÓN'} · infracciones ${invalidFrames} · cerca: ${world.getNearby()?.label||'—'}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('beforeunload',()=>world.dispose());
</script></html>
