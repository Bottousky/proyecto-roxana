<!doctype html><html lang="es"><meta charset="utf-8"><title>Ohmdal · Recorrido continuo · Revisión</title>
<style>body{margin:0;background:#122c34;color:#ecdabc;font:12px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}nav,aside{position:fixed;background:#122c34ec;padding:12px;z-index:2;border:1px solid #cfb27670}nav{top:10px;left:10px;right:10px}aside{bottom:10px;left:10px;max-width:680px;pointer-events:none}button,select{font:inherit;background:#274d51;color:#f4dfba;border:1px solid #c2ac7466;padding:9px;margin:2px}p{margin:5px 0}.hidden nav,.hidden aside{display:none}#result{white-space:pre-line;max-height:180px;overflow:auto}.pass{color:#afd7a8}.fail{color:#ff9584}</style>
<canvas tabindex="0" id="world" aria-label="Recorrido de revisión"></canvas>
<nav aria-label="Revisión del recorrido"><label>Lugar <select id="area"></select></label><button id="visit">Ir al lugar</button><label>Hora <select id="phase"></select></label><button id="hour">Fijar hora de revisión</button><button id="forward">Caminar al siguiente lugar</button><button id="back">Caminar al lugar anterior</button><button id="tour">Recorrer todos los cruces</button><button id="hide">Ocultar controles [H]</button><p>Prueba en memoria. No lee ni escribe partidas. Clic para caminar; WASD. Los cruces usan el mismo mundo y colisiones del juego.</p></nav>
<aside aria-label="Resultado del recorrido"><p id="status">Cargando arte…</p><p id="performance"></p><p id="result" role="status"></p></aside>
<script type="module">
import * as THREE from 'three';import {ContinuousWorld} from '../src/continuous-world.js';import {AREAS} from '../src/content.js';import {freshState} from '../src/state.js';import {JOURNEY_PHASES,advanceJourneyTime} from '../src/story-time.js';import {EXTERIORS,passagesFor,toKingdom} from '../src/kingdom-geography.js';import {updateDaylight} from '../src/world-time.js';
const $=s=>document.querySelector(s),state=freshState({muted:true}),world=new ContinuousWorld($('#world')),held=new Set();let ready=false,last=performance.now(),tick=0,frames=[],tour=null,crossed=0,maxShift=0;
let framePeaks=[],buildTimes=[];const createRegion=world.createRegion.bind(world);world.createRegion=(...args)=>{const start=performance.now(),result=createRegion(...args);buildTimes.push([args[0],Math.round(performance.now()-start)]);return result;};
const timing=document.createElement('p');timing.id='timing';document.querySelector('aside').append(timing);
state.flags={awaken:true,workshop:true,gate:true,pump:true,distribution:true,irrigation:true,beacon_link:true,beacon_supply:true,beacon_network:true,beacon_lens:true};
$('#area').replaceChildren(...Object.values(AREAS).map(a=>new Option(a.name,a.id)));$('#area').value='plaza';$('#phase').replaceChildren(...JOURNEY_PHASES.map((p,i)=>new Option(p.label,String(i))));
function fixHour(){state.journeyTime={phase:Number($('#phase').value)};for(const r of world.regions.values())updateDaylight(r,{...state,flags:{},area:'portal',visited:[]},1,true);}
function visit(){tour=null;state.area=$('#area').value;state.visited=[state.area];state.journeyTime={phase:Number($('#phase').value)};world.loadArea(AREAS[state.area],state);fixHour();$('#world').focus();}
function walk(direction){const exits=passagesFor(state.area),index=EXTERIORS.indexOf(state.area);const exit=exits.find(e=>EXTERIORS.indexOf(e.target)===index+direction);if(exit)world.followPassage(exit);}
const probeLabel=document.createElement('label');probeLabel.innerHTML='<input type="checkbox" id="probe"> Inspeccionar pieza';document.querySelector('nav').append(probeLabel);
$('#visit').onclick=visit;$('#hour').onclick=()=>{state.journeyTime={phase:Number($('#phase').value)};fixHour();};$('#forward').onclick=()=>walk(1);$('#back').onclick=()=>walk(-1);$('#hide').onclick=()=>document.body.classList.add('hidden');
$('#tour').onclick=()=>{state.area='portal';state.visited=[];world.loadArea(AREAS.portal,state);tour={direction:1,start:performance.now(),due:performance.now()+300};crossed=0;maxShift=0;framePeaks=[];buildTimes=[];last=performance.now();$('#result').textContent='Recorriendo el reino…';};
window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.body.classList.toggle('hidden');else held.add(e.key.toLowerCase());});window.addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>held.clear());window.addEventListener('resize',()=>world.resize());$('#world').onclick=e=>{if(!$('#probe').checked){world.setTarget(world.pick(e.clientX,e.clientY));return;}const rect=$('#world').getBoundingClientRect(),ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),world.camera);const hits=ray.intersectObjects(world.engine.scene.children,true).filter(hit=>{for(let o=hit.object;o;o=o.parent)if(!o.visible)return false;return !hit.object.material?.transparent;}).slice(0,5);$('#result').textContent=hits.map(hit=>{const o=hit.object;return [o.name||o.type,o.parent?.name||'',o.position.toArray().map(v=>v.toFixed(2)).join(','),'hit '+hit.point.toArray().map(v=>v.toFixed(2)).join(',')].join(' · ');}).join('\n');};
function loop(now){const elapsed=(now-last)/1000,dt=Math.min(.05,elapsed);last=now;if(tour){framePeaks.push(elapsed*1000);const sorted=[...framePeaks].sort((a,b)=>a-b);timing.textContent=`Cuadros: máximo ${Math.round(sorted.at(-1))} ms · p99 ${Math.round(sorted[Math.floor(sorted.length*.99)])} ms · >50 ms ${sorted.filter(n=>n>50).length} · construcciones durante viaje ${JSON.stringify(buildTimes)}`;}if(ready){
 // Review hour is explicit, independent of the fully repaired fixture.
 const lightingState={...state,flags:state.flags,journeyTime:state.journeyTime};
 world.update(dt,lightingState,{x:Number(held.has('d'))-Number(held.has('a')),z:Number(held.has('s'))-Number(held.has('w')),run:!!tour});
 const event=world.getTravelEvent();if(event?.target){const old=toKingdom(state.area,world.getPlayerPosition()),focus=world.focus.clone(),origin=world.active.area.id;const screen=world.getScreenPosition({x:world.player.position.x,z:world.player.position.z});state.area=event.target;state.visited.push(state.area);world.loadArea(AREAS[state.area],state,null,{continuous:true});world.update(0,state,{x:0,z:0});const after=toKingdom(state.area,world.getPlayerPosition()),screenAfter=world.getScreenPosition({x:world.player.position.x,z:world.player.position.z});const error=Math.hypot(old[0]-after[0],old[1]-after[1]),shift=Math.hypot(screen.x-screenAfter.x,screen.y-screenAfter.y);maxShift=Math.max(maxShift,shift);crossed++;$('#result').textContent+=`\n${origin} → ${state.area}: posición Δ ${error.toFixed(3)}, cámara Δ ${shift.toFixed(3)} px, suelo ${world.canStand(...world.getPlayerPosition())?'seguro':'ERROR'}`;if(tour){tour.due=now+200;tour.start=now;}}
 if(tour&&now>tour.due){if(state.area==='lighthouse'&&tour.direction===1){tour.direction=-1;tour.due=now+300;}else if(state.area==='portal'&&tour.direction===-1){$('#result').textContent+=`\nFINAL: ${crossed} cruces, máximo salto ${maxShift.toFixed(3)} px`;$('#result').className='pass';tour=null;}else{walk(tour.direction);tour.due=now+2000;}}
 if(tour&&now-tour.start>25000){$('#result').textContent+='\nERROR: recorrido detenido';$('#result').className='fail';tour=null;}
 frames.push(elapsed);if(frames.length>100)frames.shift();if(now-tick>500){tick=now;const p=world.getPlayerPosition();$('#status').textContent=`${AREAS[state.area].name} · ${p.map(n=>n.toFixed(2)).join(', ')} · ${world.regions.size} sectores residentes · ${world.canStand(...p)?'suelo seguro':'colisión'}`;$('#performance').textContent=`${Math.round(1/(frames.reduce((a,b)=>a+b,0)/frames.length))} FPS · ${world.renderer.info.render.calls} llamadas · ${world.renderer.info.memory.geometries} geometrías`;}
}requestAnimationFrame(loop);}
const result=await world.assetsReady;if(result.ok){visit();const start=performance.now();$('#status').textContent='Preparando el reino…';await world.prepareJourney();timing.textContent=`Preparación inicial: ${Math.round(performance.now()-start)} ms`;ready=true;last=performance.now();requestAnimationFrame(loop);}else $('#status').textContent='Error al cargar arte';
</script></html>
