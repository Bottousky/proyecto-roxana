<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohmdal · Movimiento y reposo</title>
<style>body{margin:0;background:#102c32;color:#e9dec5;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}nav{position:fixed;z-index:2;left:12px;top:12px;right:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#112b32f0;padding:10px}button,select{font:inherit;min-height:42px;background:#29434b;color:#efe5c9;border:1px solid #bbad7955;padding:6px 10px}aside{position:fixed;bottom:18px;left:18px;z-index:2;padding:14px;background:#112b32f5;max-width:480px}#status{margin:0 0 8px}#poses{display:flex;gap:4px}.pose{width:96px;height:110px;background-color:#456063;background-repeat:no-repeat;background-size:500% 400%;border:1px solid #bea77844}small{display:block;margin-top:10px;color:#b2c5b9}</style>
<canvas id="world" aria-label="Prueba del personaje en el mundo" tabindex="0"></canvas>
<nav><label>Personaje <select id="actor"><option value="player">Viajero</option><option value="edda">Edda</option><option value="lumen">Lumen</option><option value="nereo">Nereo</option><option value="vega">Vega</option><option value="consejera">Ivara</option><option value="yesca">Yesca</option><option value="marin">Marín</option><option value="tala">Tala</option></select></label><button data-move="0,1">Frente</button><button data-move="1,0">Derecha</button><button data-move="0,-1">Espalda</button><button data-move="-1,0">Izquierda</button><button id="stop">Detener</button><button id="pause">Pausar</button><button id="reset">Volver al centro</button><label><input type="checkbox" id="reduced">Movimiento reducido</label></nav>
<aside><p id="status" role="status">Cargando arte…</p><div id="poses" aria-label="Poses de reposo: frente, derecha, espalda e izquierda"></div><small>Prueba aislada del motor real. No modifica partidas guardadas. Clic en el suelo para probar las rutas.</small></aside>
<script type="module">
import {World} from '../src/world.js';import {AREAS} from '../src/content.js';import {freshState} from '../src/state.js';
const state=freshState({muted:true});state.flags.awaken=true;
const world=new World(document.querySelector('#world'));let input={x:0,z:0,paused:false},last=performance.now();
const assets=await world.assetsReady;if(!assets.ok)throw new Error(assets.missing.join(', '));world.loadArea(AREAS.portal,state,[0,8]);
function reset(){input.x=input.z=0;world.setPlayerPosition([0,8]);}
function select(){reset();const previous=world.player;world.root.remove(previous);world.actors=world.actors.filter(a=>a.g!==previous);world.player=world.character(document.querySelector('#actor').value,0,8);world.root.add(world.player);const selected=document.querySelector('#actor').value;document.querySelector('#poses').innerHTML=Array.from({length:4},(_,i)=>`<div class="pose" style="background-image:url('/assets/actors/${selected}.webp');background-position:0 ${i*100/3}%" title="${['Frente','Derecha','Espalda','Izquierda'][i]}"></div>`).join('');}
document.querySelector('#actor').onchange=select;select();
for(const button of document.querySelectorAll('[data-move]'))button.onclick=()=>{[input.x,input.z]=button.dataset.move.split(',').map(Number);world.target=null;world.route=[]};
document.querySelector('#stop').onclick=()=>{input.x=input.z=0;world.target=null;world.route=[]};
document.querySelector('#pause').onclick=()=>{input.paused=!input.paused;document.querySelector('#pause').textContent=input.paused?'Reanudar':'Pausar'};
document.querySelector('#reset').onclick=reset;document.querySelector('#reduced').onchange=e=>{state.settings.reducedMotion=e.target.checked};
document.querySelector('#world').onclick=e=>{input.x=input.z=0;world.setTarget(world.pick(e.clientX,e.clientY))};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;world.update(dt,state,input);const animation=world.actors.find(a=>a.g===world.player).animation;document.querySelector('#status').textContent=`${document.querySelector('#actor').selectedOptions[0].textContent} · ${input.paused?'pausa':world.walking?'caminando':'reposo'} · ${['frente','derecha','espalda','izquierda'][animation.direction]} · cuadro ${animation.frame} · posición ${world.player.position.x.toFixed(1)}, ${world.player.position.z.toFixed(1)}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('beforeunload',()=>world.dispose());
</script></html>
