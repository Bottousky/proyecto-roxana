<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Ohmdal HD-2D — Harness H1+H2</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #11141c;
        color: #f5f0dd;
      }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      button, select { font: inherit; }
      canvas { display: block; width: 100%; height: 100%; }
      .topbar {
        position: fixed; inset: max(10px, env(safe-area-inset-top)) 10px auto 10px;
        z-index: 4; display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
        max-width: min(970px, calc(100vw - 20px)); padding: 9px 11px;
        border: 1px solid #9e815a88; border-radius: 10px;
        background: #171923e8; box-shadow: 0 10px 30px #0008;
      }
      .topbar h1 { margin: 0 9px 0 0; font-size: 14px; letter-spacing: .06em; }
      .topbar label { display: flex; align-items: center; gap: 5px; font-size: 12px; }
      .topbar select, .topbar button, .diagnosis button, .touch button {
        min-height: 34px; border: 1px solid #bd9b69; border-radius: 6px;
        background: #292b37; color: inherit; padding: 5px 9px;
      }
      select:disabled, button:disabled { opacity: .66; cursor: not-allowed; }
      .topbar button:focus-visible, .topbar select:focus-visible,
      .diagnosis button:focus-visible, .touch button:focus-visible {
        outline: 3px solid #65d9e8; outline-offset: 2px;
      }
      .hud {
        position: fixed; z-index: 4; left: 12px; bottom: max(12px, env(safe-area-inset-bottom));
        width: min(390px, calc(100vw - 24px)); padding: 10px 12px;
        border-left: 4px solid #72d7df; border-radius: 5px;
        background: #151721e8; font-size: 13px; line-height: 1.4;
      }
      .hud strong { color: #8ee8ee; }
      .diagnosis {
        position: fixed; z-index: 4; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
        width: min(330px, calc(100vw - 24px)); padding: 10px 12px;
        border: 1px solid #bd9b69; border-radius: 8px; background: #151721e8;
        font-size: 12px; line-height: 1.4;
      }
      .diagnosis h2 { margin: 0 0 5px; font-size: 14px; }
      .diagnosis p { margin: 5px 0; }
      .touch { display: none; position: fixed; z-index: 5; right: 12px; bottom: 185px; grid-template: repeat(3, 42px) / repeat(3, 42px); gap: 4px; }
      .touch button { padding: 0; touch-action: none; user-select: none; }
      .touch [data-move="up"] { grid-area: 1 / 2; }
      .touch [data-move="left"] { grid-area: 2 / 1; }
      .touch [data-move="right"] { grid-area: 2 / 3; }
      .touch [data-move="down"] { grid-area: 3 / 2; }
      .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); }
      @media (max-width: 720px) {
        .topbar { max-height: 168px; overflow: auto; }
        .topbar h1 { width: 100%; }
        .hud { bottom: 8px; width: calc(100vw - 118px); font-size: 11px; }
        .diagnosis { right: 8px; bottom: 142px; width: calc(100vw - 16px); }
        .touch { display: grid; bottom: 8px; }
      }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <div id="app" aria-label="Laboratorio tridimensional de Ohmdal"></div>
    <div class="topbar" aria-label="Comparativas del laboratorio">
      <h1>OHMDAL · H1+H2</h1>
      <label>Cámara
        <select id="camera-variant" disabled><option value="quasi-orthographic">Casi ortográfica · elegida</option></select>
      </label>
      <label>Estudiante
        <select id="direction-variant" disabled><option value="4">4 direcciones · elegida</option></select>
      </label>
      <label>Ohm
        <select id="ohm-variant" disabled><option value="sprite">Sprite · elegido</option></select>
      </label>
      <button id="time-toggle" type="button">Crepúsculo</button>
      <button id="route-toggle" type="button">Recorrido automático</button>
      <label><input id="reduced-motion" type="checkbox" /> Reducir movimiento</label>
    </div>
    <div class="hud" role="status" aria-live="polite"><strong id="zone-label">Portal</strong><br /><span id="status-label">WASD o flechas para recorrer.</span><br /><span id="metrics-label"></span></div>
    <section class="diagnosis" aria-labelledby="diagnosis-title">
      <h2 id="diagnosis-title">Diagnóstico protegido de Lumen</h2>
      <p id="diagnosis-label">Acercate al Taller para comenzar. La prueba nunca bloquea el recorrido.</p>
      <button id="diagnosis-next" type="button" disabled>Siguiente acción segura</button>
    </section>
    <div class="touch" aria-label="Movimiento táctil">
      <button type="button" data-move="up" aria-label="Mover hacia arriba">▲</button>
      <button type="button" data-move="left" aria-label="Mover hacia la izquierda">◀</button>
      <button type="button" data-move="right" aria-label="Mover hacia la derecha">▶</button>
      <button type="button" data-move="down" aria-label="Mover hacia abajo">▼</button>
    </div>
    <p class="sr-only" id="controls-help">El recorrido también funciona con W A S D o teclas de dirección.</p>
    <script type="module" src="/src/labs/ohmdal-hd2d-preprod/main.ts"></script>
  </body>
</html>
