name: Validate

on:
  push:
    branches:
      - 'explore/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/agents/run-antigravity.mjs
      - run: node scripts/agents/run-antigravity.mjs --help
      - run: node --check scripts/agents/validate-bounded-loop-state.mjs
      - run: npm run loop:ohmdal-plaza:validate
      - run: node --check scripts/3d/fetch-polyhaven.mjs
      - run: node --check scripts/3d/inventory-vendor-pack.mjs
      - run: node --check scripts/3d/validate-hero-reference-pack.mjs
      - run: npm run 3d:validate-hero-ref -- assets/references/hero-packs/ohm/hero-reference.json
      - run: npm run 3d:validate-hero-ref -- assets/references/hero-packs/galvanoscope/hero-reference.json
      - run: npm run verify
      - run: npm run 3d:validate-manifests
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"roxana/validate\",\"description\":\"verify + 3d manifests + hero gates + bounded loop\"}"
