<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ohmdal — HD-2D Rebuild</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Ohmdal"></canvas>
      <div id="hud" class="hud" aria-live="polite">
        <div id="hud-region" class="hud-chip">Plaza</div>
        <div id="hud-prompt" class="hud-prompt" hidden></div>
        <div id="hud-state" class="hud-state">Mundo dormido</div>
      </div>
      <div id="dialog" class="dialog" hidden>
        <div class="dialog-portrait" id="dialog-portrait"></div>
        <div class="dialog-body">
          <div class="dialog-speaker" id="dialog-speaker">—</div>
          <div class="dialog-line" id="dialog-line">…</div>
          <div class="dialog-cta">[E] continuar</div>
        </div>
      </div>
      <div id="bitacora" class="bitacora" hidden>
        <div class="bitacora-header">
          <span class="bitacora-title">Bitácora</span>
          <button id="bitacora-close" class="bitacora-close" type="button">×</button>
        </div>
        <div id="bitacora-entries" class="bitacora-entries"></div>
      </div>
      <div id="title" class="title">
        <div class="title-inner">
          <h1>Ohmdal</h1>
          <p class="title-sub">HD-2D Rebuild · greenfield</p>
          <button id="title-start" class="title-button" type="button">Entrar al Portal</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
